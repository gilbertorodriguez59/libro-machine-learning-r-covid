# Perfil PDF profesional estable.

project:
  output-dir: docs

book:
  output-file: "Aprendizaje-y-Clasificacion-Automatica-con-R"

filters: []

execute:
  echo: true
  warning: false
  message: false
  freeze: auto
  fig_crop: false

knitr:
  opts_chunk:
    dev: "png"
    dpi: 180
    fig.width: 7
    fig.height: 4.5
    out.width: "92%"
    collapse: false
    comment: "#>"

format:
  pdf:
    toc: true
    lof: true
    number-sections: true
    keep-tex: false
    include-in-header:
      - latex/configuracion-pdf.tex
      - latex/portada-pdf.tex
