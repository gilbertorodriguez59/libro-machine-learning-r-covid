name: Publicar capítulos HTML actualizados

on:
  push:
    branches: [main]
    paths:
      - "12-kmeans.qmd"
      - "index.qmd"
      - "_quarto.yml"
      - "util_graficas.R"
      - "scripts/agregar_covid_kmeans.py"
      - "datos/covid19/procesados/**"
      - "datos/covid19/diccionarios/**"
      - "_extensions/**"
      - ".github/workflows/render-quarto.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply COVID section to k-means
        run: |
          python scripts/agregar_covid_kmeans.py

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependencies with pak
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::ggplot2
            any::readr
            any::dplyr
            any::tidyr
            any::shiny
            any::shinylive
            any::cluster
          cache-version: 4

      - name: Verify R packages
        shell: Rscript {0}
        run: |
          pkgs <- c("rmarkdown", "knitr", "ggplot2", "readr", "dplyr", "tidyr",
                    "shiny", "shinylive", "cluster")
          faltan <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          if (length(faltan)) stop("Faltan paquetes: ", paste(faltan, collapse = ", "))
          cat("R:", R.version.string, "\n")

      - name: Render cover and k-means chapter as HTML
        run: |
          quarto render index.qmd --to html --no-cache
          quarto render 12-kmeans.qmd --to html --no-cache

      - name: Normalize PDF links and verify COVID section
        run: |
          for f in docs/index.html docs/12-kmeans.html; do
            sed -i 's/Aprendizaje-y-Clasificación-Automática-con-R\.pdf/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf/g' "$f"
          done

          grep -q "Caso aplicado B: k-means con COVID-19" docs/12-kmeans.html
          grep -q "MURIO queda fuera del agrupamiento" docs/12-kmeans.html

      - name: Commit updated source and HTML chapter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A 12-kmeans.qmd docs/index.html docs/12-kmeans.html docs/site_libs
          if git diff --cached --quiet; then
            echo "No hay cambios para publicar"
          else
            git commit -m "Publicar capítulo 13 k-means con caso COVID [skip ci]"
            git push
          fi
