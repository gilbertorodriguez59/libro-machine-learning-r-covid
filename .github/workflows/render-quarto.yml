name: Revision final, web, PDF y Colab

on:
  push:
    branches: [main]
    paths:
      - "*.qmd"
      - "*.yml"
      - "*.yaml"
      - "*.R"
      - "*.ipynb"
      - "colab/**"
      - "scripts/**"
      - "latex/**"
      - "imagenes/**"
      - "recursos/**"
      - "recursos_colab/**"
      - "datos/covid19/procesados/**"
      - "datos/covid19/muestras/**"
      - "datos/covid19/diccionarios/**"
      - "datos/atus_ml_preparado.csv"
      - "_extensions/**"
      - ".github/workflows/render-quarto.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cierre:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply robust ATUS preparation fix
        run: |
          python scripts/corregir_preparacion_atus.py

      - name: Uniform complementary materials in chapters 6 to 13
        run: |
          python scripts/uniformar_materiales_capitulos_06_13.py

      - name: Add Colab to all complementary-material tables
        run: |
          python scripts/agregar_colab_a_tablas_materiales.py

      - name: Remove duplicated Colab blocks outside tables
        run: |
          python scripts/quitar_colab_duplicado_fuera_tabla.py

      - name: Apply final interactives
        run: |
          python scripts/agregar_interactivos_cierre.py

      - name: Balance Quarto Divs
        run: |
          python scripts/corregir_divs_quarto.py

      - name: Regenerate master and chapter Colab notebooks
        run: |
          python scripts/generar_colab_desde_quarto.py
          python - <<'PY'
          import json
          from pathlib import Path

          master = Path('Aprendizaje_y_Clasificacion_Automatica_con_R_Colab.ipynb')
          assert master.exists()
          x = json.load(open(master, encoding='utf-8'))
          assert x['nbformat'] == 4
          assert len(x['cells']) > 100
          s = json.dumps(x, ensure_ascii=False)
          assert 'Caso aplicado B: k-NN con COVID-19' in s
          assert 'Caso aplicado B: k-means con COVID-19' in s

          indice = Path('colab/00-indice-colabs.ipynb')
          assert indice.exists()
          capitulos = sorted(Path('colab').glob('[0-9][0-9]-*.ipynb'))
          capitulos = [p for p in capitulos if p.name != '00-indice-colabs.ipynb']
          assert len(capitulos) == 13, f'Se esperaban 13 Colabs de capítulo y hay {len(capitulos)}'
          for p in capitulos:
              nb = json.load(open(p, encoding='utf-8'))
              contenido = json.dumps(nb, ensure_ascii=False)
              assert nb['nbformat'] == 4
              assert 'independiente y autónomo' in contenido
              assert 'Preparación automática y autónoma del capítulo' in contenido
              assert 'util_graficas.R' in contenido
              assert 'atus_ml_preparado.csv' in contenido
              assert 'covid19_mexico_2022_ml_preparado.csv.gz' in contenido
          print('Colab maestro validado:', len(x['cells']), 'celdas')
          print('Índice Colab validado')
          print('13 Colabs autónomos validados')
          PY

      - name: Run editorial and structural review
        run: |
          python scripts/revision_cierre.py

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Setup TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff-dev libjpeg-dev

      - name: Install R dependencies with pak
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::ggplot2
            any::readr
            any::dplyr
            any::tidyr
            any::stringr
            any::data.table
            any::scales
            any::class
            any::rpart
            any::randomForest
            any::ranger
            any::e1071
            any::naivebayes
            any::neuralnet
            any::cluster
            any::caret
            any::factoextra
            any::plotly
            any::DT
            any::htmltools
            any::jsonlite
            any::fs
            any::shiny
            any::shinylive
          cache-version: 14

      - name: Verify R packages
        shell: Rscript {0}
        run: |
          pkgs <- c('rmarkdown','knitr','ggplot2','readr','dplyr','tidyr','stringr','data.table','scales','class','rpart','randomForest','ranger','e1071','naivebayes','neuralnet','cluster','caret','factoextra','plotly','DT','shiny','shinylive')
          faltan <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          if (length(faltan)) stop('Faltan paquetes: ', paste(faltan, collapse = ', '))

      - name: Render complete PDF book first
        run: |
          rm -rf docs .quarto _freeze
          quarto render --profile pdf --to pdf --no-cache 2>&1 | tee render-pdf-final.log
          test -f docs/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf
          test -s docs/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf
          cp docs/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf /tmp/libro-final.pdf

      - name: Render complete web book
        run: |
          quarto render --to html --no-cache 2>&1 | tee render-web-final.log
          if grep -E "\[WARNING\].*Div at line.*unclosed" render-web-final.log; then
            echo "Se detectaron Div sin cerrar en la web"
            exit 1
          fi

      - name: Restore PDF and normalize links
        run: |
          cp /tmp/libro-final.pdf docs/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf
          find docs -type f -name '*.html' -print0 | xargs -0 sed -i 's/Aprendizaje-y-Clasificación-Automática-con-R\.pdf/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf/g'
          rm -f "docs/Aprendizaje-y-Clasificación-Automática-con-R.pdf" docs/libro-machine-learning-r.pdf

      - name: Final validation
        run: |
          test -f docs/index.html
          test -f docs/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf
          test -f Aprendizaje_y_Clasificacion_Automatica_con_R_Colab.ipynb
          test -f colab/00-indice-colabs.ipynb
          grep -q "Cuaderno Google Colab" docs/01-introduccion.html
          grep -q "Cuaderno Google Colab" docs/12-kmeans.html
          if grep -q "Cuaderno Google Colab del capítulo" docs/01-introduccion.html; then exit 1; fi
          if grep -q "Cuaderno Google Colab del capítulo" docs/12-kmeans.html; then exit 1; fi
          grep -q "06-knn.ipynb" docs/05-knn.html
          grep -q "13-kmeans.ipynb" docs/12-kmeans.html
          grep -qi "video-responsive" docs/01-introduccion.html
          grep -qi "video-responsive" docs/12-kmeans.html

      - name: Commit final reviewed version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A *.qmd Aprendizaje_y_Clasificacion_Automatica_con_R_Colab.ipynb colab revision-cierre.md docs
          if git diff --cached --quiet; then
            echo "No hay cambios finales para publicar"
          else
            git commit -m "Conservar Colab solo dentro de tablas de materiales [skip ci]"
            git push
          fi
