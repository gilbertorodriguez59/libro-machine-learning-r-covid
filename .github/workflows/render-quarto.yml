name: Publicar comparación COVID y k-means

on:
  push:
    branches: [main]
    paths:
      - "08-evaluacion-modelos.qmd"
      - "12-kmeans.qmd"
      - "scripts/agregar_comparacion_covid_capitulo_9.py"
      - "scripts/agregar_covid_kmeans.py"
      - "datos/covid19/procesados/**"
      - "datos/covid19/diccionarios/**"
      - "_quarto.yml"
      - "util_graficas.R"
      - "_extensions/**"
      - ".github/workflows/render-quarto.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply COVID comparison and k-means section
        run: |
          python scripts/agregar_comparacion_covid_capitulo_9.py
          python scripts/agregar_covid_kmeans.py

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependencies with pak
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::ggplot2
            any::readr
            any::dplyr
            any::tidyr
            any::scales
            any::class
            any::rpart
            any::ranger
            any::e1071
            any::neuralnet
            any::cluster
            any::shiny
            any::shinylive
          cache-version: 7

      - name: Verify R and Shinylive packages
        shell: Rscript {0}
        run: |
          pkgs <- c(
            "rmarkdown", "knitr", "ggplot2", "readr", "dplyr", "tidyr",
            "scales", "class", "rpart", "ranger", "e1071", "neuralnet",
            "cluster", "shiny", "shinylive"
          )
          faltan <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          if (length(faltan)) stop("Faltan paquetes: ", paste(faltan, collapse = ", "))
          cat("R:", R.version.string, "\n")
          cat("shinylive:", as.character(packageVersion("shinylive")), "\n")

      - name: Render chapter 9 and chapter 13 as HTML
        run: |
          quarto render 08-evaluacion-modelos.qmd --to html --no-cache
          quarto render 12-kmeans.qmd --to html --no-cache

      - name: Normalize PDF links and verify COVID sections
        run: |
          for f in docs/08-evaluacion-modelos.html docs/12-kmeans.html; do
            sed -i 's/Aprendizaje-y-Clasificación-Automática-con-R\.pdf/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf/g' "$f"
          done

          grep -q "Comparación integrada de modelos con COVID-19" docs/08-evaluacion-modelos.html
          grep -q "Regresión logística" docs/08-evaluacion-modelos.html
          grep -q "Random Forest" docs/08-evaluacion-modelos.html
          grep -q "SVM radial" docs/08-evaluacion-modelos.html
          grep -q "Naive Bayes" docs/08-evaluacion-modelos.html
          grep -q "Red neuronal" docs/08-evaluacion-modelos.html

          grep -q "Caso aplicado B: k-means con COVID-19" docs/12-kmeans.html
          grep -q "MURIO queda fuera del agrupamiento" docs/12-kmeans.html

      - name: Commit updated sources and HTML chapters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            08-evaluacion-modelos.qmd \
            12-kmeans.qmd \
            docs/08-evaluacion-modelos.html \
            docs/12-kmeans.html \
            docs/site_libs

          if git diff --cached --quiet; then
            echo "No hay cambios para publicar"
          else
            git commit -m "Publicar comparación COVID y caso k-means [skip ci]"
            git push
          fi
