name: Publicar capítulos HTML actualizados

on:
  push:
    branches: [main]
    paths:
      - "05-knn.qmd"
      - "06-arboles-decision.qmd"
      - "07-random-forest.qmd"
      - "_quarto.yml"
      - "util_graficas.R"
      - "datos/covid19/procesados/**"
      - "_extensions/**"
      - ".github/workflows/render-quarto.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependencies with pak
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::ggplot2
            any::readr
            any::dplyr
            any::tidyr
            any::shiny
            any::shinylive
            any::rpart
            any::ranger
            any::class
          cache-version: 2

      - name: Verify R packages
        shell: Rscript {0}
        run: |
          pkgs <- c("rmarkdown", "knitr", "ggplot2", "readr", "dplyr", "tidyr",
                    "shiny", "shinylive", "rpart", "ranger", "class")
          faltan <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          if (length(faltan)) stop("Faltan paquetes: ", paste(faltan, collapse = ", "))
          cat("R:", R.version.string, "\n")
          cat("rmarkdown:", as.character(packageVersion("rmarkdown")), "\n")
          cat("knitr:", as.character(packageVersion("knitr")), "\n")

      - name: Render only chapters 6 to 8 as HTML
        run: |
          quarto render 05-knn.qmd --to html --no-cache
          quarto render 06-arboles-decision.qmd --to html --no-cache
          quarto render 07-random-forest.qmd --to html --no-cache

      - name: Normalize PDF links and verify COVID sections
        run: |
          for f in docs/05-knn.html docs/06-arboles-decision.html docs/07-random-forest.html; do
            sed -i 's/Aprendizaje-y-Clasificación-Automática-con-R\.pdf/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf/g' "$f"
          done

          grep -q "Caso aplicado B: k-NN con COVID-19" docs/05-knn.html
          grep -q "Caso aplicado B: árbol de decisión con COVID-19" docs/06-arboles-decision.html
          grep -q "Caso aplicado B: Random Forest con COVID-19" docs/07-random-forest.html

      - name: Commit updated HTML chapters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/05-knn.html docs/06-arboles-decision.html docs/07-random-forest.html docs/site_libs
          if git diff --cached --quiet; then
            echo "No hay cambios HTML para publicar"
          else
            git commit -m "Publicar capítulos 6-8 con casos COVID [skip ci]"
            git push
          fi
