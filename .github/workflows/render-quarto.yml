name: Render Quarto book

on:
  push:
    branches: [main]
    paths:
      - "*.qmd"
      - "*.yml"
      - "*.yaml"
      - "*.R"
      - "*.ipynb"
      - "latex/**"
      - "imagenes/**"
      - "recursos/**"
      - "recursos_colab/**"
      - "datos/covid19/procesados/**"
      - "datos/covid19/muestras/**"
      - "datos/covid19/diccionarios/**"
      - "_extensions/**"
      - ".github/workflows/render-quarto.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Setup TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

      - name: Install R packages
        shell: Rscript {0}
        run: |
          pkgs <- c(
            "rmarkdown", "knitr", "ggplot2", "readr", "dplyr", "tidyr",
            "stringr", "data.table", "shiny", "shinylive", "ranger",
            "rpart", "randomForest", "e1071", "naivebayes", "neuralnet",
            "cluster", "class", "plotly", "DT", "caret", "factoextra",
            "htmltools", "jsonlite", "fs"
          )
          faltan <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          if (length(faltan)) install.packages(faltan, repos = "https://cloud.r-project.org", dependencies = TRUE)

      - name: Render PDF
        run: |
          rm -rf docs .quarto _freeze
          quarto render --profile pdf --to pdf --no-cache 2>&1 | tee render-pdf.log
          if grep -E "\[WARNING\].*Div at line.*unclosed" render-pdf.log; then
            echo "Se detectaron Div sin cerrar en el PDF"
            exit 1
          fi
          test -f docs/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf
          cp docs/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf /tmp/libro-final.pdf

      - name: Render web
        run: |
          quarto render --no-cache 2>&1 | tee render-web.log
          if grep -E "\[WARNING\].*Div at line.*unclosed" render-web.log; then
            echo "Se detectaron Div sin cerrar en la web"
            exit 1
          fi

      - name: Normalize PDF link and keep one PDF
        run: |
          cp /tmp/libro-final.pdf docs/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf

          find docs -type f -name '*.html' -print0 | xargs -0 sed -i \
            's/Aprendizaje-y-Clasificación-Automática-con-R\.pdf/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf/g'

          rm -f "docs/Aprendizaje-y-Clasificación-Automática-con-R.pdf"
          rm -f "docs/libro-machine-learning-r.pdf"

          test -f docs/index.html
          test -f docs/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf
          test ! -f "docs/Aprendizaje-y-Clasificación-Automática-con-R.pdf"
          test ! -f "docs/libro-machine-learning-r.pdf"
          test -f docs/Aprendizaje_y_Clasificacion_Automatica_con_R_Colab.ipynb
          grep -qi "shinylive" docs/04-regresion-logistica.html
          grep -q "Aprendizaje-y-Clasificacion-Automatica-con-R.pdf" docs/index.html

      - name: Commit rendered site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "No hay cambios renderizados para publicar"
          else
            git commit -m "Actualizar sitio renderizado [skip ci]"
            git push
          fi
