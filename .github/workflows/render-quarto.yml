name: Publicar capítulos HTML actualizados

on:
  push:
    branches: [main]
    paths:
      - "09-svm.qmd"
      - "10-naive-bayes.qmd"
      - "11-redes-neuronales.qmd"
      - "index.qmd"
      - "_quarto.yml"
      - "util_graficas.R"
      - "scripts/agregar_covid_capitulos_10_12.py"
      - "datos/covid19/procesados/**"
      - "datos/covid19/diccionarios/**"
      - "_extensions/**"
      - ".github/workflows/render-quarto.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply COVID sections to chapters 10 to 12
        run: |
          python scripts/agregar_covid_capitulos_10_12.py

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependencies with pak
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::ggplot2
            any::readr
            any::dplyr
            any::tidyr
            any::shiny
            any::shinylive
            any::e1071
            any::neuralnet
          cache-version: 3

      - name: Verify R packages
        shell: Rscript {0}
        run: |
          pkgs <- c("rmarkdown", "knitr", "ggplot2", "readr", "dplyr", "tidyr",
                    "shiny", "shinylive", "e1071", "neuralnet")
          faltan <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          if (length(faltan)) stop("Faltan paquetes: ", paste(faltan, collapse = ", "))
          cat("R:", R.version.string, "\n")

      - name: Render cover and chapters 10 to 12 as HTML
        run: |
          quarto render index.qmd --to html --no-cache
          quarto render 09-svm.qmd --to html --no-cache
          quarto render 10-naive-bayes.qmd --to html --no-cache
          quarto render 11-redes-neuronales.qmd --to html --no-cache

      - name: Normalize PDF links and verify COVID sections
        run: |
          for f in docs/index.html docs/09-svm.html docs/10-naive-bayes.html docs/11-redes-neuronales.html; do
            sed -i 's/Aprendizaje-y-Clasificación-Automática-con-R\.pdf/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf/g' "$f"
          done

          grep -q "Caso aplicado B: SVM con COVID-19" docs/09-svm.html
          grep -q "Caso aplicado B: Naive Bayes con COVID-19" docs/10-naive-bayes.html
          grep -q "Caso aplicado B: red neuronal con COVID-19" docs/11-redes-neuronales.html

      - name: Commit updated sources and HTML chapters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A 09-svm.qmd 10-naive-bayes.qmd 11-redes-neuronales.qmd docs/index.html docs/09-svm.html docs/10-naive-bayes.html docs/11-redes-neuronales.html docs/site_libs
          if git diff --cached --quiet; then
            echo "No hay cambios para publicar"
          else
            git commit -m "Publicar capítulos 10-12 con casos COVID y actualizar portada [skip ci]"
            git push
          fi
