name: Revision final, web, PDF y Colab

on:
  push:
    branches: [main]
    paths:
      - "*.qmd"
      - "*.yml"
      - "*.yaml"
      - "*.R"
      - "*.ipynb"
      - "scripts/**"
      - "latex/**"
      - "imagenes/**"
      - "recursos/**"
      - "recursos_colab/**"
      - "datos/covid19/procesados/**"
      - "datos/covid19/muestras/**"
      - "datos/covid19/diccionarios/**"
      - "datos/atus_ml_preparado.csv"
      - "_extensions/**"
      - ".github/workflows/render-quarto.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cierre:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final interactives
        run: |
          python scripts/agregar_interactivos_cierre.py

      - name: Regenerate complete Colab notebook
        run: |
          python scripts/generar_colab_desde_quarto.py
          python - <<'PY'
          import json
          p = 'Aprendizaje_y_Clasificacion_Automatica_con_R_Colab.ipynb'
          x = json.load(open(p, encoding='utf-8'))
          assert x['nbformat'] == 4
          assert len(x['cells']) > 100
          s = json.dumps(x, ensure_ascii=False)
          assert 'Caso aplicado B: k-NN con COVID-19' in s
          assert 'Caso aplicado B: k-means con COVID-19' in s
          print('Colab validado:', len(x['cells']), 'celdas')
          PY

      - name: Run editorial and structural review
        run: |
          python scripts/revision_cierre.py

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Setup TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff-dev \
            libjpeg-dev

      - name: Install R dependencies with pak
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::ggplot2
            any::readr
            any::dplyr
            any::tidyr
            any::stringr
            any::data.table
            any::scales
            any::class
            any::rpart
            any::randomForest
            any::ranger
            any::e1071
            any::naivebayes
            any::neuralnet
            any::cluster
            any::caret
            any::factoextra
            any::plotly
            any::DT
            any::htmltools
            any::jsonlite
            any::fs
            any::shiny
            any::shinylive
          cache-version: 8

      - name: Verify R packages
        shell: Rscript {0}
        run: |
          pkgs <- c(
            "rmarkdown", "knitr", "ggplot2", "readr", "dplyr", "tidyr",
            "stringr", "data.table", "scales", "class", "rpart", "randomForest",
            "ranger", "e1071", "naivebayes", "neuralnet", "cluster", "caret",
            "factoextra", "plotly", "DT", "shiny", "shinylive"
          )
          faltan <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          if (length(faltan)) stop("Faltan paquetes: ", paste(faltan, collapse = ", "))
          cat("R:", R.version.string, "\n")
          cat("shinylive:", as.character(packageVersion("shinylive")), "\n")

      - name: Render complete web book
        run: |
          quarto render --to html --no-cache 2>&1 | tee render-web-final.log
          if grep -E "\[WARNING\].*Div at line.*unclosed" render-web-final.log; then
            echo "Se detectaron Div sin cerrar en la web"
            exit 1
          fi

      - name: Normalize PDF links in HTML
        run: |
          find docs -type f -name '*.html' -print0 | xargs -0 sed -i \
            's/Aprendizaje-y-Clasificación-Automática-con-R\.pdf/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf/g'

      - name: Render complete PDF book
        run: |
          quarto render --profile pdf --to pdf --no-cache 2>&1 | tee render-pdf-final.log
          if grep -E "\[WARNING\].*Div at line.*unclosed" render-pdf-final.log; then
            echo "Se detectaron Div sin cerrar en el PDF"
            exit 1
          fi
          test -f docs/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf

      - name: Final validation
        run: |
          test -f docs/index.html
          test -f docs/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf
          test -s docs/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf
          test -f Aprendizaje_y_Clasificacion_Automatica_con_R_Colab.ipynb

          grep -q "Laboratorio interactivo ATUS: mes, hora y víctimas" docs/03-analisis-exploratorio.html
          grep -q "Laboratorio interactivo COVID: agrupamiento k-means" docs/12-kmeans.html
          grep -q "Comparación integrada de modelos con COVID-19" docs/08-evaluacion-modelos.html
          grep -q "Caso aplicado B: k-means con COVID-19" docs/12-kmeans.html
          grep -q "Aprendizaje-y-Clasificacion-Automatica-con-R.pdf" docs/index.html
          grep -qi "shinylive" docs/03-analisis-exploratorio.html
          grep -qi "shinylive" docs/12-kmeans.html

          rm -f "docs/Aprendizaje-y-Clasificación-Automática-con-R.pdf"
          rm -f docs/libro-machine-learning-r.pdf

      - name: Commit final reviewed version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A \
            03-analisis-exploratorio.qmd \
            12-kmeans.qmd \
            Aprendizaje_y_Clasificacion_Automatica_con_R_Colab.ipynb \
            revision-cierre.md \
            docs

          if git diff --cached --quiet; then
            echo "No hay cambios finales para publicar"
          else
            git commit -m "Revision final: interactivos ATUS-COVID, Colab y PDF actualizado [skip ci]"
            git push
          fi
